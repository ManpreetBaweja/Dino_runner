<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f5ed">
    <title>Dino Runner</title>
    <link rel="stylesheet" href="style.css?v=9">
    <script type="module" src="src/game/index.js"></script>
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <a class="wordmark" href="./" aria-label="Dino Runner home">
          <span class="wordmark-mark" aria-hidden="true">D</span>
          <span>Dino Runner</span>
        </a>
        <span class="build-label">Prototype 01</span>
      </header>

      <section class="game" aria-labelledby="game-title">
        <div class="game-heading">
          <div>
            <p class="eyebrow">Three-lane runner / motion-control prototype</p>
            <h1 id="game-title">Find your line.</h1>
          </div>
          <div class="score-box" aria-live="polite">
            <span class="score-label">DISTANCE</span>
            <span class="score-value" id="score">00000</span>
          </div>
        </div>

        <div class="canvas-wrap">
          <canvas id="game-canvas" width="800" height="500" aria-label="Dino Runner. Choose a normal or video-controlled run; use arrow keys to change lanes."></canvas>
          <div class="camera-preview" id="camera-preview" hidden>
            <video id="camera-video" autoplay muted playsinline></video>
            <canvas id="pose-canvas" width="640" height="480" aria-hidden="true"></canvas>
          </div>
        </div>

        <div class="game-controls">
          <p class="key-hint"><kbd>←</kbd> <kbd>→</kbd><span>lane</span><kbd>SPACE</kbd><span>jump</span><kbd>↓</kbd><span>duck</span></p>
          <div class="control-actions">
            <span id="camera-status" role="status" aria-live="polite">Camera off · video stays on this device</span>
            <div class="run-actions">
              <button id="normal-run-button" type="button">Start normal run</button>
              <button id="video-run-button" type="button">Start video-controlled run</button>
            </div>
            <div class="session-actions">
              <button id="calibrate-button" type="button" hidden>Calibrate again</button>
              <button id="pause-button" type="button" hidden>Pause</button>
            </div>
          </div>
        </div>
      </section>

      <footer class="footer">
        <span>Built for the open road.</span>
        <span>Camera pose processing stays on this device</span>
      </footer>
    </main>
  </body>
</html>
